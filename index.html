<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Substance Awareness | पदार्थ जागरूकता</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #2a3650;
    --accent: #60a5fa;
    --accent2: #34d399;
    --accent3: #f472b6;
    --accent-hi: #fb923c;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --bot-bubble: #1a2236;
    --user-bubble: #1e3a5f;
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(96,165,250,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 90%, rgba(251,146,60,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* HEADER */
  .header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa 0%, #34d399 50%, #fb923c 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--surface2), 0 0 0 3px rgba(96,165,250,0.5);
  }

  .header-info { flex: 1; }

  .header-info h1 {
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .header-info h1 span { color: var(--accent-hi); }

  .header-info p {
    font-size: 11px;
    color: var(--accent2);
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }

  .header-info p::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: pulse 2s infinite;
  }

  .lang-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .lang-badge:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.bot { align-items: flex-start; }
  .msg.user { align-items: flex-end; }

  .bubble {
    max-width: 88%;
    padding: 12px 15px;
    border-radius: var(--radius);
    line-height: 1.65;
    font-size: 13.5px;
  }

  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #1d4a7a;
    border-top-right-radius: 4px;
  }

  .bubble .emoji-lead { font-size: 22px; display: block; margin-bottom: 8px; }

  .bubble strong {
    color: var(--accent);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
  }

  .bubble.hindi, .bubble.hindi li, .bubble.hindi p {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 13px;
    line-height: 1.8;
  }

  .bubble.hindi strong {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 13px;
  }

  .bubble ul { padding-left: 16px; margin-top: 6px; }
  .bubble ul li { margin-bottom: 5px; color: #94a3b8; font-size: 13px; }
  .bubble .back-hint { margin-top: 10px; font-size: 12px; color: var(--text-muted); font-style: italic; }

  /* LANGUAGE SELECTOR */
  .lang-select {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.4s ease 0.15s forwards;
    opacity: 0;
  }

  .lang-btn {
    flex: 1;
    padding: 16px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.25s;
    text-align: center;
  }

  .lang-btn .lang-flag { font-size: 28px; display: block; margin-bottom: 6px; }
  .lang-btn .lang-name { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px; display: block; }
  .lang-btn .lang-sub { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; }

  .lang-btn.en:hover, .lang-btn.en.active {
    border-color: var(--accent);
    background: rgba(96,165,250,0.08);
    box-shadow: 0 0 20px rgba(96,165,250,0.1);
  }

  .lang-btn.hi:hover, .lang-btn.hi.active {
    border-color: var(--accent-hi);
    background: rgba(251,146,60,0.08);
    box-shadow: 0 0 20px rgba(251,146,60,0.1);
    font-family: 'Noto Sans Devanagari', sans-serif;
  }

  .lang-btn.hi .lang-sub {
    font-family: 'Noto Sans Devanagari', sans-serif;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-width: 90%;
    animation: fadeUp 0.4s ease 0.1s forwards;
    opacity: 0;
  }

  .options.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    max-width: 100%;
  }

  .opt-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.3;
  }

  .opt-btn.hindi-btn {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 12px;
    line-height: 1.5;
  }

  .opt-btn:hover {
    background: #1e2d45;
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(96,165,250,0.1);
  }

  .opt-btn.hindi-btn:hover { color: var(--accent-hi); border-color: var(--accent-hi); }

  .opt-icon { font-size: 16px; flex-shrink: 0; }
  .opt-label { font-weight: 500; display: block; }
  .opt-sub { font-size: 11px; color: var(--text-muted); display: block; margin-top: 1px; }

  /* RESOURCE LINKS (Drive / Reel) */
  .link-btn {
    background: var(--surface2);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.3;
    text-decoration: none;
  }
  .link-btn:hover {
    background: rgba(52,211,153,0.08);
    box-shadow: 0 4px 12px rgba(52,211,153,0.12);
    transform: translateY(-1px);
  }
  .link-btn.hindi-btn { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 12px; }

  /* INPUT */
  .input-bar {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .input-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 9px 15px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: var(--text-muted); font-size: 12px; }

  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.08); opacity: 0.9; }
  .send-btn svg { width: 17px; height: 17px; fill: #0a0f1e; }

  .disclaimer {
    font-size: 10.5px;
    color: var(--text-muted);
    text-align: center;
    padding: 5px 12px 8px;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .typing {
    display: flex; gap: 4px; align-items: center; padding: 2px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  @media (max-width: 480px) {
    .app { border: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">🧠</div>
    <div class="header-info">
      <h1>Substance Awareness <span>| पदार्थ जागरूकता</span></h1>
      <p>Online — Ready to Help &nbsp;·&nbsp; <span id="visitorCount">👁️ …</span></p>
    </div>
    <div class="lang-badge" onclick="resetToLanguage()" title="Change Language">🌐 Lang</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type or choose an option above…" autocomplete="off"/>
    <button class="send-btn" onclick="handleUserText()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
  <div class="disclaimer" id="disclaimer">⚕️ For educational purposes only. Always consult a healthcare professional. | केवल शैक्षणिक उद्देश्य के लिए। | PDFs Only For Educational Purpose</div>
</div>

<script>
const ms = document.getElementById('messages');
const inputEl = document.getElementById('userInput');

// ═══════════════════════════════════════════════════════════
// VISITOR COUNTER (free, no-signup counting API)
// Counts once per page load. Uses a unique key so it doesn't
// collide with anyone else's counter on the same free service.
// ═══════════════════════════════════════════════════════════
(function trackVisitor() {
  const el = document.getElementById('visitorCount');
  fetch('https://countapi.mileshilliard.com/api/v1/hit/brainpsychiatrist_github_io_substance_bot')
    .then(r => r.json())
    .then(data => {
      const n = Number(data.value).toLocaleString('en-IN');
      el.textContent = `👁️ ${n} visits`;
    })
    .catch(() => {
      el.style.display = 'none'; // fail silently if the counter service is down
    });
})();

// ═══════════════════════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════════════════════
function addBotMsg(html, isHindi = false, delay = 0) {
  return new Promise(r => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = `<div class="bubble${isHindi ? ' hindi' : ''}">${html}</div>`;
      ms.appendChild(div);
      ms.scrollTop = ms.scrollHeight;
      r();
    }, delay);
  });
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${text}</div>`;
  ms.appendChild(div);
  ms.scrollTop = ms.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  ms.appendChild(div);
  ms.scrollTop = ms.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function clearOptions() {
  const o = document.getElementById('cur-opts');
  if (o) o.remove();
}

function addOptions(opts, isGrid = false) {
  clearOptions();
  const wrap = document.createElement('div');
  wrap.className = (isGrid ? 'options grid' : 'options');
  wrap.id = 'cur-opts';
  const isHi = lang === 'hi';

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (isHi ? ' hindi-btn' : '');
    btn.innerHTML = `<span class="opt-icon">${opt.icon}</span><span><span class="opt-label">${opt.label}</span>${opt.sub ? `<span class="opt-sub">${opt.sub}</span>` : ''}</span>`;
    btn.onclick = () => handleOption(opt.key);
    wrap.appendChild(btn);
  });

  ms.appendChild(wrap);
  ms.scrollTop = ms.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// FLOW
// ═══════════════════════════════════════════════════════════
async function showMainMenu(isReturn = false) {
  const isHi = lang === 'hi';
  if (isReturn) {
    const msg = isHi
      ? `↩️ <strong>मुख्य मेनू</strong><br><span style="color:var(--text-muted);font-size:12px">आप क्या जानना चाहते हैं?</span>`
      : `↩️ <strong>Back to Main Menu</strong><br><span style="color:var(--text-muted);font-size:12px">What would you like to know about?</span>`;
    await addBotMsg(msg, isHi);
  }
  addOptions(isHi ? hiMainOpts : enMainOpts, true);
}

async function showContent(key) {
  clearOptions();
  const isHi = lang === 'hi';
  const db = isHi ? hiContent : enContent;
  const c = db[key];
  if (!c) return;

  addTyping();
  await new Promise(r => setTimeout(r, 700));
  removeTyping();

  const backHint = isHi
    ? `<p class="back-hint">वापस जाने के लिए <strong style="color:var(--accent)">MENU</strong> टाइप करें या नीचे दबाएं</p>`
    : `<p class="back-hint">Type <strong style="color:var(--accent)">MENU</strong> or tap below to go back</p>`;

  await addBotMsg(`<span class="emoji-lead">${c.icon}</span><strong>${c.title}</strong>${c.body}${backHint}`, isHi);

  if (c.links && c.links.length) {
    addLinkButtons(c.links, isHi);
  }

  const backOpt = isHi
    ? [{ key:'back', icon:'↩️', label:'मुख्य मेनू पर जाएं', sub:'' }]
    : [{ key:'back', icon:'↩️', label:'Back to Main Menu', sub:'' }];
  addOptions(backOpt);
}

function addLinkButtons(links, isHi) {
  const wrap = document.createElement('div');
  wrap.className = 'options';
  links.forEach(l => {
    const a = document.createElement('a');
    a.className = 'link-btn' + (isHi ? ' hindi-btn' : '');
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = `<span class="opt-icon">${l.icon}</span><span><span class="opt-label">${l.label}</span>${l.sub ? `<span class="opt-sub">${l.sub}</span>` : ''}</span>`;
    wrap.appendChild(a);
  });
  ms.appendChild(wrap);
  ms.scrollTop = ms.scrollHeight;
}

async function handleOption(key) {
  clearOptions();
  const isHi = lang === 'hi';

  if (key === 'back') {
    await showMainMenu(true);
    return;
  }

  if (key === 'treatment') {
    const label = isHi ? '🏥 उपचार विकल्प' : '🏥 Treatment Options';
    addUserMsg(label);
    addTyping();
    await new Promise(r => setTimeout(r, 600));
    removeTyping();
    const msg = isHi
      ? `<span class="emoji-lead">🏥</span><strong>उपचार जानकारी</strong><br><span style="color:var(--text-muted);font-size:12px">आप किस उपचार के बारे में जानना चाहते हैं?</span>`
      : `<span class="emoji-lead">🏥</span><strong>Treatment Information</strong><br><span style="color:var(--text-muted);font-size:12px">Which treatment would you like to know about?</span>`;
    await addBotMsg(msg, isHi);
    addOptions(isHi ? hiTreatOpts : enTreatOpts);
    return;
  }

  const allOpts = [...(isHi ? hiMainOpts : enMainOpts), ...(isHi ? hiTreatOpts : enTreatOpts)];
  const found = allOpts.find(o => o.key === key);
  if (found) addUserMsg(`${found.icon} ${found.label}`);

  await showContent(key);
}

// ═══════════════════════════════════════════════════════════
// TEXT INPUT
// ═══════════════════════════════════════════════════════════
function handleUserText() {
  const val = inputEl.value.trim();
  if (!val) return;
  inputEl.value = '';
  const lower = val.toLowerCase();

  if (!lang) {
    if (lower.includes('hindi') || lower.includes('हिंदी') || lower === 'hi') {
      selectLanguage('hi', val);
    } else if (lower.includes('english') || lower === 'en') {
      selectLanguage('en', val);
    } else {
      addUserMsg(val);
      addBotMsg('Please select your language first. 👆<br>पहले भाषा चुनें। 👆');
    }
    return;
  }

  if (lower === 'menu' || lower === 'back' || lower === 'मेनू' || lower === 'वापस') {
    addUserMsg(val);
    clearOptions();
    showMainMenu(true);
    return;
  }

  const keyMap = {
    '1':'alcohol','alcohol':'alcohol','शराब':'alcohol',
    '2':'opioid','opioid':'opioid','opioids':'opioid','ओपिओइड':'opioid',
    '3':'cannabis','cannabis':'cannabis','भांग':'cannabis','गांजा':'cannabis','weed':'cannabis',
    '4':'nicotine','nicotine':'nicotine','निकोटीन':'nicotine','tobacco':'nicotine',
    '5':'cocaine','cocaine':'cocaine','कोकेन':'cocaine','coke':'cocaine',
    '6':'amphetamine','amphetamine':'amphetamine','एम्फेटामाइन':'amphetamine','meth':'amphetamine',
    '7':'mdma','mdma':'mdma','ecstasy':'mdma','molly':'mdma',
    '8':'lsd','lsd':'lsd','acid':'lsd',
    '9':'caffeine','caffeine':'caffeine','कैफीन':'caffeine','coffee':'caffeine',
    '10':'treatment','treatment':'treatment','उपचार':'treatment',
  };

  if (lower in keyMap) {
    addUserMsg(val);
    clearOptions();
    const key = keyMap[lower];
    if (key === 'treatment') handleOption('treatment');
    else showContent(key);
    return;
  }

  addUserMsg(val);
  clearOptions();
  const fallback = lang === 'hi'
    ? `🤔 मुझे समझ नहीं आया। कृपया नीचे से विकल्प चुनें या <strong style="color:var(--accent)">MENU</strong> टाइप करें।`
    : `🤔 I didn't catch that. Please choose an option below or type <strong style="color:var(--accent)">MENU</strong>.`;
  addBotMsg(fallback, lang === 'hi');
  showMainMenu();
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleUserText(); });

  if (userText) addUserMsg(userText);
  else addUserMsg(lang === 'hi' ? '🇮🇳 हिंदी' : '🇬🇧 English');

  addTyping();
  await new Promise(r => setTimeout(r, 800));

  if (lang === 'hi') {
    inputEl.placeholder = 'संदेश टाइप करें या ऊपर से विकल्प चुनें…';

    await addBotMsg(`
      <span class="emoji-lead">🙏</span>
      <strong>स्वागत है! धन्यवाद कि आपने हमसे संपर्क किया।</strong><br><br>
      हम आपकी मदद के लिए तैयार हैं।<br>
      <span style="color:var(--text-muted);font-size:12px">कृपया चुनें कि आप क्या जानना चाहते हैं:</span>
    `, true);
  } else {
    inputEl.placeholder = 'Type or choose an option above…';
    document.getElementById('disclaimer').textContent = '⚕️ For educational purposes only. Always consult a healthcare professional. | PDFs Only For Educational Purpose';
    await addBotMsg(`
      <span class="emoji-lead">🙏</span>
      <strong>Welcome! Thank you for reaching out.</strong><br><br>
      We are here and ready to help you.<br>
      <span style="color:var(--text-muted);font-size:12px">Please choose what you'd like to know about:</span>
    `);
  }

  addOptions(lang === 'hi' ? hiMainOpts : enMainOpts, true);
}

    <strong>Welcome | स्वागत है</strong><br><br>
    Please select your language.<br>
    <span style="font-family:'Noto Sans Devanagari',sans-serif;">कृपया अपनी भाषा चुनें।</span>
  `);

  // Language selector buttons
  const wrap = document.createElement('div');
  wrap.className = 'lang-select';
  wrap.id = 'cur-opts';

  const enBtn = document.createElement('button');
  enBtn.className = 'lang-btn en';
  enBtn.innerHTML = `<span class="lang-flag">🇬🇧</span><span class="lang-name">English</span><span class="lang-sub">Continue in English</span>`;
  enBtn.onclick = () => selectLanguage('en');

  const hiBtn = document.createElement('button');
  hiBtn.className = 'lang-btn hi';
  hiBtn.innerHTML = `<span class="lang-flag">🇮🇳</span><span class="lang-name" style="font-family:'Noto Sans Devanagari',sans-serif;">हिंदी</span><span class="lang-sub" style="font-family:'Noto Sans Devanagari',sans-serif;">हिंदी में जारी रखें</span>`;
  hiBtn.onclick = () => selectLanguage('hi');

  wrap.appendChild(enBtn);
  wrap.appendChild(hiBtn);
  ms.appendChild(wrap);
  ms.scrollTop = ms.scrollHeight;
}

init();
</script>
</body>
</html>
